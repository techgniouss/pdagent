# GitHub Advanced Security — Secret Scanning Allowlist
#
# The two GOCSPX-* values below are **public installed-app OAuth client
# secrets** for native/desktop applications.  Per RFC 8252 §8.4, client
# secrets for native applications cannot be kept confidential and are
# therefore not treated as secrets.  PKCE (RFC 7636) is the actual
# security boundary.
#
# Gemini CLI credentials (GEMINI_CLI_OAUTH_CLIENT_ID/SECRET) are publicly
# committed by Google in the open-source google-gemini/gemini-cli repository
# (Apache-2.0).  Antigravity credentials (DEFAULT_OAUTH_CLIENT_ID/SECRET)
# are an installed-app client registered with a localhost redirect URI,
# making the client secret non-confidential by design.
#
# References:
#   https://www.rfc-editor.org/rfc/rfc8252#section-8.4
#   https://github.com/google-gemini/gemini-cli/blob/main/packages/core/src/code_assist/oauth2.ts
#   https://docs.github.com/en/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/excluding-folders-and-files-from-secret-scanning

paths-ignore:
  # These files intentionally contain public installed-app OAuth credentials.
  # See comment above for the full RFC 8252 rationale.
  - "pocket_desk_agent/constants.py"
